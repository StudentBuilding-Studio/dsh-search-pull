# Bundle patch for dsh-search-pull.
#
# Host-only: there is no client half, so nothing is auto-discovered from
# `dsh.client`. The row is inserted under the package's own name, which the
# Loader resolves from the profile's installed bundles.
#
# No `config` here on purpose. The defaults are the intended behaviour, and any
# config written here ships to every user, including paths that only exist on
# one machine. To turn on the optional JSONL audit trail, add this to your own
# profile's copy of the row:
#
#   config:
#     debugFile: /path/you/choose/search-pull-trace.jsonl
- insert:
    - id: dsh-search-pull
      name: 'dsh-search-pull'
